name: Build personal RateSync DMG
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/personal-dmg.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Download pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: BiKing567/RateSync
          ref: c14bdc9756e3400280520fe712f209a975b3cc52
      - name: Apply Apple Music and Spotify safety changes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, pathlib, subprocess
          patch = base64.b64decode('')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          script = pathlib.Path('build-personal-dmg.command')
          script.write_bytes(base64.b64decode(''))
          script.chmod(0o755)
          icons = {'Quality/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x-1024.png': '', 'Quality/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x-128.png': '', 'Quality/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x-16.png': '', 'Quality/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x-256.png': '', 'Quality/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x-32.png': '', 'Quality/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x-512.png': '', 'Quality/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x-64.png': ''}
          for filename, encoded in icons.items():
              pathlib.Path(filename).write_bytes(base64.b64decode(encoded))
          PYTHON
      - name: Test, build and verify DMG
        run: ./build-personal-dmg.command
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyRate
          path: build/SpotifyRate.dmg
          if-no-files-found: error
