name: Build personal RateSync DMG
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/personal-dmg.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Download pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: BiKing567/RateSync
          ref: c14bdc9756e3400280520fe712f209a975b3cc52
      - name: Apply Apple Music and Spotify safety changes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, pathlib, subprocess
          patch = base64.b64decode('')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          script = pathlib.Path('build-personal-dmg.command')
          script.write_bytes(base64.b64decode(''))
          script.chmod(0o755)
          PYTHON
      - name: Test, build and verify DMG
        run: ./build-personal-dmg.command
      - uses: actions/upload-artifact@v4
        with:
          name: RateSync-AppleMusic-Spotify
          path: build/RateSync-AppleMusic-Spotify.dmg
          if-no-files-found: error
